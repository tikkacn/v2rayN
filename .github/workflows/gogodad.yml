name: sync_and_build_windows

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "上游正式 Release Tag，例如 7.24.4；留空则使用上游最新正式版"
        required: false
        default: ""
        type: string
      release_tag:
        description: "NoAds Release Tag；留空自动使用 v版本号-NoAds"
        required: false
        default: ""
        type: string
      force_rebuild:
        description: "即使同版本资产已存在，也重新构建"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "构建成功后发布到 Releases"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-and-build-windows
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 2dust/v2rayN
  RELEASE_ASSET: v2rayN-windows-64-NoAds.zip

jobs:
  sync_and_build:
    runs-on: windows-latest

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v7
        with:
          path: automation
          fetch-depth: 1

      - name: Resolve upstream formal release
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "tikkacn-v2rayN-NoAds"
          }

          $upstreamTag = $env:INPUT_BASE_REF.Trim()
          if ([string]::IsNullOrWhiteSpace($upstreamTag)) {
            $latest = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:UPSTREAM_REPO/releases/latest" `
              -Headers $headers
            $upstreamTag = [string]$latest.tag_name
          }

          if ([string]::IsNullOrWhiteSpace($upstreamTag)) {
            throw "Cannot resolve upstream release tag"
          }

          $version = $upstreamTag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unsupported upstream release tag: $upstreamTag"
          }

          $releaseTag = $env:INPUT_RELEASE_TAG.Trim()
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = "v$version-NoAds"
          }

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$([uri]::EscapeDataString($releaseTag))"
          $assetExists = $false
          try {
            $existing = Invoke-RestMethod -Uri $releaseUri -Headers $headers
            $assetExists = @($existing.assets | Where-Object { $_.name -eq $env:RELEASE_ASSET }).Count -gt 0
          }
          catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) { throw }
          }

          $forceRebuild = $env:INPUT_FORCE_REBUILD -eq "true"
          $shouldBuild = $forceRebuild -or -not $assetExists

          "upstream_tag=$upstreamTag" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File $env:GITHUB_OUTPUT -Append
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Upstream formal release: $upstreamTag"
          Write-Host "NoAds release tag: $releaseTag"
          Write-Host "Existing asset: $assetExists"
          Write-Host "Force rebuild: $forceRebuild"
          Write-Host "Should build: $shouldBuild"

      - name: No new formal release
        if: steps.resolve.outputs.should_build != 'true'
        shell: pwsh
        run: |
          Write-Host "${{ steps.resolve.outputs.release_tag }} and $env:RELEASE_ASSET already exist; nothing to build."

      - name: Checkout exact upstream release with submodules
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayN
          ref: ${{ steps.resolve.outputs.upstream_tag }}
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify upstream source and submodules
        if: steps.resolve.outputs.should_build == 'true'
        id: source
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          git submodule sync --recursive
          git submodule update --init --recursive --force

          $submoduleStatus = @(git submodule status --recursive)
          $badSubmodules = @($submoduleStatus | Where-Object { $_ -match '^[\-\+U]' })
          if ($badSubmodules.Count -gt 0) {
            throw "Submodule checkout does not match the upstream release: $($badSubmodules -join '; ')"
          }

          $props = Get-Content "v2rayN\Directory.Build.props" -Raw -Encoding UTF8
          if ($props -notmatch '<Version>\s*([^<]+)\s*</Version>') {
            throw "Cannot read Version from v2rayN/Directory.Build.props"
          }
          $sourceVersion = $Matches[1].Trim()
          if ($sourceVersion -ne "${{ steps.resolve.outputs.version }}") {
            throw "Tag/project version mismatch: tag=${{ steps.resolve.outputs.version }}, project=$sourceVersion"
          }

          $sourceSha = git rev-parse HEAD
          "sha=$sourceSha" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Verified upstream source: $sourceSha"
          $submoduleStatus | ForEach-Object { Write-Host $_ }

      - name: Setup .NET 10
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.1xx

      - name: Apply NoAds changes
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          function Replace-ExactlyOnce {
            param(
              [string]$Path,
              [string]$Old,
              [string]$New,
              [string]$Label
            )
            $text = Get-Content $Path -Raw -Encoding UTF8
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) {
              throw "$Label expected exactly one match in $Path, found $count"
            }
            $text = $text.Replace($Old, $New)
            Set-Content $Path $text -Encoding UTF8 -NoNewline
          }

          function Get-NormalizedTextSha256 {
            param([string]$Path)
            $text = Get-Content $Path -Raw -Encoding UTF8
            $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
            return [System.Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($bytes)
            ).ToLowerInvariant()
          }

          $globalFile = "v2rayN\ServiceLib\Global.cs"
          $coreInfoFile = "v2rayN\ServiceLib\Manager\CoreInfoManager.cs"
          $updateServiceFile = "v2rayN\ServiceLib\Services\UpdateService.cs"
          $resourceDesignerFile = "v2rayN\ServiceLib\Resx\ResUI.Designer.cs"
          $mainXamlFile = "v2rayN\v2rayN.Desktop\Views\MainWindow.axaml"
          $mainCodeFile = "v2rayN\v2rayN.Desktop\Views\MainWindow.axaml.cs"
          $wpfXamlFile = "v2rayN\v2rayN\Views\MainWindow.xaml"
          $wpfCodeFile = "v2rayN\v2rayN\Views\MainWindow.xaml.cs"
          $amazUpgradeFile = "v2rayN\AmazTool\UpgradeApp.cs"
          $amazProgramFile = "v2rayN\AmazTool\Program.cs"

          $updaterPatches = @(
            @{
              Source = "..\automation\patches\amaztool\UpgradeApp.cs"
              Target = $amazUpgradeFile
              UpstreamSha256 = "185f7939ba52fbb95084f91d72c2a6414853a7944103cdfd7801bf4e704166ba"
            },
            @{
              Source = "..\automation\patches\amaztool\Program.cs"
              Target = $amazProgramFile
              UpstreamSha256 = "b437d8c2486ef81f78c447ef4fbfcc171e3fb6f4730b1aedeb5cdb461b0bbb92"
            }
          )
          foreach ($patch in $updaterPatches) {
            if (-not (Test-Path $patch.Source -PathType Leaf)) {
              throw "Smart updater source is missing: $($patch.Source)"
            }
            $upstreamHash = Get-NormalizedTextSha256 $patch.Target
            if ($upstreamHash -cne $patch.UpstreamSha256) {
              throw "Upstream AmazTool changed; review the smart updater before rebuilding: $($patch.Target)"
            }
            Copy-Item -Path $patch.Source -Destination $patch.Target -Force
          }

          Replace-ExactlyOnce `
            -Path $globalFile `
            -Old '{ ECoreType.v2rayN, "2dust/v2rayN" },' `
            -New '{ ECoreType.v2rayN, "tikkacn/v2rayN" },' `
            -Label "Self-update repository"

          Replace-ExactlyOnce `
            -Path $globalFile `
            -Old '    public const string PromotionUrl = @"aHR0cHM6Ly85LjIzNDQ1Ni54eXovYWJjLmh0bWw=";' `
            -New '    public const string GuidePortalUrl = @"https://guide.uutec.net/";' `
            -Label "Guide portal URL"

          Replace-ExactlyOnce `
            -Path $coreInfoFile `
            -Old '/download/{0}/v2rayN-windows-64.zip' `
            -New '/download/v{0}-NoAds/v2rayN-windows-64-NoAds.zip' `
            -Label "NoAds download asset"

          $oldVersionReturn = '        return new UpdateResult(true, new SemanticVersion(tagName));'
          $newVersionReturn = @(
            '        if (type == ECoreType.v2rayN && tagName?.EndsWith("-NoAds", StringComparison.OrdinalIgnoreCase) == true)',
            '        {',
            '            tagName = tagName[..^"-NoAds".Length];',
            '        }',
            '',
            '        return new UpdateResult(true, new SemanticVersion(tagName));'
          ) -join [Environment]::NewLine

          Replace-ExactlyOnce `
            -Path $updateServiceFile `
            -Old $oldVersionReturn `
            -New $newVersionReturn `
            -Label "NoAds semantic-version normalization"

          $updateText = Get-Content $updateServiceFile -Raw -Encoding UTF8
          $desktopPattern = '(?s)(?<indent>[ \t]*)if\s*\(\s*File\.Exists\(Path\.Combine\(Utils\.GetBaseDirectory\(\),\s*"libHarfBuzzSharp\.dll"\)\)\s*\)\s*\{\s*return\s+url\?\.Replace\("\.zip",\s*"-desktop\.zip"\);\s*\}'
          $desktopMatches = [regex]::Matches($updateText, $desktopPattern)
          if ($desktopMatches.Count -ne 1) {
            throw "Desktop asset rename block expected exactly one match, found $($desktopMatches.Count)"
          }
          $indent = $desktopMatches[0].Groups["indent"].Value
          $desktopReplacement = @(
            "${indent}if (url?.Contains(""v2rayN-windows-64-NoAds.zip"", StringComparison.OrdinalIgnoreCase) == true)",
            "${indent}{",
            "${indent}    return url;",
            "${indent}}",
            "",
            "${indent}if (File.Exists(Path.Combine(Utils.GetBaseDirectory(), ""libHarfBuzzSharp.dll"")))",
            "${indent}{",
            "${indent}    return url?.Replace("".zip"", ""-desktop.zip"");",
            "${indent}}"
          ) -join [Environment]::NewLine
          $updateText = [regex]::Replace($updateText, $desktopPattern, $desktopReplacement, 1)
          Set-Content $updateServiceFile $updateText -Encoding UTF8 -NoNewline

          Replace-ExactlyOnce `
            -Path $mainXamlFile `
            -Old '<MenuItem x:Name="menuPromotion" Header="{x:Static resx:ResUI.menuPromotion}" />' `
            -New '<MenuItem x:Name="menuGuidePortal" Header="{x:Static resx:ResUI.menuGuidePortal}" />' `
            -Label "Avalonia guide portal menu"

          Replace-ExactlyOnce `
            -Path $mainCodeFile `
            -Old '        menuPromotion.Click += MenuPromotion_Click;' `
            -New '        menuGuidePortal.Click += MenuGuidePortal_Click;' `
            -Label "Avalonia guide portal click registration"

          $oldAvaloniaMethod = @(
            '    private void MenuPromotion_Click(object? sender, RoutedEventArgs e)',
            '    {',
            '        ProcUtils.ProcessStart($"{Utils.Base64Decode(Global.PromotionUrl)}?t={DateTime.Now.Ticks}");',
            '    }'
          ) -join [Environment]::NewLine
          $newAvaloniaMethod = @(
            '    private void MenuGuidePortal_Click(object? sender, RoutedEventArgs e)',
            '    {',
            '        ProcUtils.ProcessStart(Global.GuidePortalUrl);',
            '    }'
          ) -join [Environment]::NewLine
          Replace-ExactlyOnce `
            -Path $mainCodeFile `
            -Old $oldAvaloniaMethod `
            -New $newAvaloniaMethod `
            -Label "Avalonia guide portal handler"

          $wpfXaml = Get-Content $wpfXamlFile -Raw -Encoding UTF8
          $wpfMenuCount = ([regex]::Matches($wpfXaml, '\bmenuPromotion\b')).Count
          if ($wpfMenuCount -ne 3) {
            throw "Windows guide portal menu expected three promotion identifiers, found $wpfMenuCount"
          }
          $wpfXaml = $wpfXaml.Replace('menuPromotion', 'menuGuidePortal')
          Set-Content $wpfXamlFile $wpfXaml -Encoding UTF8 -NoNewline

          Replace-ExactlyOnce `
            -Path $wpfCodeFile `
            -Old '        menuPromotion.Click += MenuPromotion_Click;' `
            -New '        menuGuidePortal.Click += MenuGuidePortal_Click;' `
            -Label "Windows guide portal click registration"

          $oldWpfMethod = @(
            '    private void MenuPromotion_Click(object sender, RoutedEventArgs e)',
            '    {',
            '        ProcUtils.ProcessStart($"{Utils.Base64Decode(Global.PromotionUrl)}?t={DateTime.Now.Ticks}");',
            '    }'
          ) -join [Environment]::NewLine
          $newWpfMethod = @(
            '    private void MenuGuidePortal_Click(object sender, RoutedEventArgs e)',
            '    {',
            '        ProcUtils.ProcessStart(Global.GuidePortalUrl);',
            '    }'
          ) -join [Environment]::NewLine
          Replace-ExactlyOnce `
            -Path $wpfCodeFile `
            -Old $oldWpfMethod `
            -New $newWpfMethod `
            -Label "Windows guide portal handler"

          $designer = Get-Content $resourceDesignerFile -Raw -Encoding UTF8
          if (([regex]::Matches($designer, '\bmenuPromotion\b')).Count -ne 2) {
            throw "Guide portal resource designer expected two promotion identifiers"
          }
          if (([regex]::Matches($designer, '查找类似 Promotion 的本地化字符串。')).Count -ne 1) {
            throw "Guide portal resource designer comment expected one match"
          }
          $designer = $designer.Replace('menuPromotion', 'menuGuidePortal')
          $designer = $designer.Replace('查找类似 Promotion 的本地化字符串。', '查找类似 Notices / Guides 的本地化字符串。')
          Set-Content $resourceDesignerFile $designer -Encoding UTF8 -NoNewline

          $resourceLabels = @{
            'ResUI.resx' = 'Notices / Guides'
            'ResUI.fa.resx' = 'اطلاعیه‌ها / راهنماها'
            'ResUI.fr.resx' = 'Annonces / Guides'
            'ResUI.hu.resx' = 'Értesítések / Útmutatók'
            'ResUI.id.resx' = 'Pengumuman / Panduan'
            'ResUI.ru.resx' = 'Уведомления / Руководства'
            'ResUI.zh-Hans.resx' = '通知 / 教程'
            'ResUI.zh-Hant.resx' = '通知 / 教學'
          }
          $resourcePattern = '(?ms)(?<prefix><data name=")menuPromotion(?<middle>" xml:space="preserve">\s*<value>).*?(?<suffix></value>\s*</data>)'
          $resourceRegex = [regex]::new($resourcePattern)
          foreach ($resourceName in $resourceLabels.Keys) {
            $resourcePath = Join-Path "v2rayN\ServiceLib\Resx" $resourceName
            $resourceText = Get-Content $resourcePath -Raw -Encoding UTF8
            if ($resourceRegex.Matches($resourceText).Count -ne 1) {
              throw "Guide portal localized resource expected one match in $resourcePath"
            }
            $label = $resourceLabels[$resourceName]
            $resourceText = $resourceRegex.Replace($resourceText, {
              param($match)
              return $match.Groups['prefix'].Value + 'menuGuidePortal' + $match.Groups['middle'].Value + $label + $match.Groups['suffix'].Value
            }, 1)
            Set-Content $resourcePath $resourceText -Encoding UTF8 -NoNewline
          }

          $promotionMarkers = @(Get-ChildItem "v2rayN" -Recurse -File -Include "*.cs", "*.xaml", "*.axaml", "*.resx" |
            Select-String -Pattern '\bmenuPromotion\b|\bPromotionUrl\b|aHR0cHM6Ly85LjIzNDQ1Ni54eXovYWJjLmh0bWw=')
          if ($promotionMarkers.Count -gt 0) {
            $details = $promotionMarkers | ForEach-Object { "$($_.Path):$($_.LineNumber):$($_.Line.Trim())" }
            throw "Promotion source markers remain after patch: $($details -join '; ')"
          }

          $guideMarkers = @(Get-ChildItem "v2rayN" -Recurse -File -Include "*.cs", "*.xaml", "*.axaml", "*.resx" |
            Select-String -Pattern '\bmenuGuidePortal\b|\bGuidePortalUrl\b|https://guide\.uutec\.net/')
          if ($guideMarkers.Count -lt 10) {
            throw "Guide portal integration is incomplete; found only $($guideMarkers.Count) markers"
          }

          $smartUpdaterText = Get-Content $amazUpgradeFile -Raw -Encoding UTF8
          $smartUpdaterMarkers = @(
            'DetectArchiveRoot',
            'ValidateArchive',
            'GetSafeOutputPath',
            'The update archive must contain exactly one v2rayN.exe',
            'Failed to replace update file after retries'
          )
          foreach ($marker in $smartUpdaterMarkers) {
            if (-not $smartUpdaterText.Contains($marker)) {
              throw "Smart updater marker is missing: $marker"
            }
          }
          $amazProgramText = Get-Content $amazProgramFile -Raw -Encoding UTF8
          if (-not $amazProgramText.Contains('Environment.ExitCode = 1')) {
            throw "AmazTool must expose a non-zero exit code on failure"
          }

          git diff --check
          Write-Host "NoAds changes applied cleanly"
          git diff --stat
          git diff -- $globalFile $coreInfoFile $updateServiceFile $resourceDesignerFile $mainXamlFile $mainCodeFile $wpfXamlFile $wpfCodeFile $amazUpgradeFile $amazProgramFile "v2rayN\ServiceLib\Resx"

      - name: Restore
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore "v2rayN\v2rayN.Desktop\v2rayN.Desktop.csproj"

      - name: Publish v2rayN Desktop (win-x64, self-contained)
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          if (Test-Path out) { Remove-Item out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path out | Out-Null

          dotnet publish "v2rayN\v2rayN.Desktop\v2rayN.Desktop.csproj" `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:EnableWindowsTargeting=true `
            -o out\app

      - name: Publish AmazTool (win-x64, self-contained)
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          dotnet publish "v2rayN\AmazTool\AmazTool.csproj" `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:PublishTrimmed=true `
            -p:EnableWindowsTargeting=true `
            -o out\amaz

      - name: Validate smart updater archive layouts
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $testRoot = "temp\updater-layout-tests"
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null

          $rootLayout = Join-Path $testRoot "root-layout"
          New-Item -ItemType Directory -Force -Path (Join-Path $rootLayout "bin\xray") | Out-Null
          Set-Content (Join-Path $rootLayout "v2rayN.exe") "dummy-main" -NoNewline
          Set-Content (Join-Path $rootLayout "AmazTool.exe") "dummy-updater" -NoNewline
          Set-Content (Join-Path $rootLayout "bin\xray\xray.exe") "dummy-core" -NoNewline
          $rootZip = Join-Path $testRoot "root-layout.zip"
          Compress-Archive -Path "$rootLayout\*" -DestinationPath $rootZip -Force

          $wrapperName = "customer-renamed-folder"
          $wrapperLayout = Join-Path $testRoot $wrapperName
          New-Item -ItemType Directory -Force -Path (Join-Path $wrapperLayout "bin\xray") | Out-Null
          Set-Content (Join-Path $wrapperLayout "v2rayN.exe") "dummy-main" -NoNewline
          Set-Content (Join-Path $wrapperLayout "AmazTool.exe") "dummy-updater" -NoNewline
          Set-Content (Join-Path $wrapperLayout "bin\xray\xray.exe") "dummy-core" -NoNewline
          $wrapperZip = Join-Path $testRoot "wrapper-layout.zip"
          Compress-Archive -Path $wrapperLayout -DestinationPath $wrapperZip -Force

          $amazTool = (Resolve-Path "out\amaz\AmazTool.exe").Path
          $cases = @(
            @{ Zip = (Resolve-Path $rootZip).Path; Layout = "Archive layout: files at ZIP root" },
            @{ Zip = (Resolve-Path $wrapperZip).Path; Layout = "Archive layout: wrapper directory '$wrapperName'" }
          )
          foreach ($case in $cases) {
            $output = @(& $amazTool validateupdate $case.Zip 2>&1)
            $text = $output -join [Environment]::NewLine
            Write-Host $text
            $markers = @(
              $case.Layout,
              "-> v2rayN.exe",
              "-> AmazTool.exe",
              "-> bin/xray/xray.exe"
            )
            foreach ($marker in $markers) {
              if (-not $text.Contains($marker)) {
                throw "Smart updater validation output is missing: $marker"
              }
            }
          }

          $unsafeZip = Join-Path $testRoot "unsafe-layout.zip"
          $stream = [System.IO.File]::Open($unsafeZip, [System.IO.FileMode]::Create)
          try {
            $archive = [System.IO.Compression.ZipArchive]::new(
              $stream,
              [System.IO.Compression.ZipArchiveMode]::Create,
              $false
            )
            try {
              foreach ($entryName in @("v2rayN.exe", "AmazTool.exe", "../outside.txt")) {
                $entry = $archive.CreateEntry($entryName)
                $writer = [System.IO.StreamWriter]::new($entry.Open())
                try { $writer.Write("dummy") } finally { $writer.Dispose() }
              }
            }
            finally {
              $archive.Dispose()
            }
          }
          finally {
            $stream.Dispose()
          }

          $PSNativeCommandUseErrorActionPreference = $false
          $unsafeOutput = @(& $amazTool validateupdate (Resolve-Path $unsafeZip).Path 2>&1)
          $unsafeExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $unsafeText = $unsafeOutput -join [Environment]::NewLine
          Write-Host $unsafeText
          if ($unsafeExitCode -ne 1 -or -not $unsafeText.Contains("Unsafe update path")) {
            throw "Smart updater did not reject a ZIP path traversal entry with exit code 1"
          }
          $global:LASTEXITCODE = 0

      - name: Download exact upstream Windows package
        if: steps.resolve.outputs.should_build == 'true'
        id: upstream_bin
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $tag = "${{ steps.resolve.outputs.upstream_tag }}"
          $asset = "v2rayN-windows-64.zip"

          if (Test-Path temp) { Remove-Item temp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path temp\up | Out-Null

          gh release download $tag `
            --repo $env:UPSTREAM_REPO `
            --pattern $asset `
            --dir temp\up

          $zipPath = Join-Path "temp\up" $asset
          if (-not (Test-Path $zipPath)) {
            throw "Upstream package not found after download: $zipPath"
          }

          New-Item -ItemType Directory -Force -Path temp\ex | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath temp\ex -Force

          $binDir = Get-ChildItem -Path temp\ex -Directory -Recurse -Force |
            Where-Object { $_.Name -ieq "bin" } |
            Select-Object -First 1
          if (-not $binDir) {
            throw "The exact upstream package does not contain bin/"
          }

          "bin_dir=$($binDir.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Verified upstream bin directory: $($binDir.FullName)"

      - name: Assemble and validate NoAds package
        if: steps.resolve.outputs.should_build == 'true'
        id: package
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          $packageRootName = [System.IO.Path]::GetFileNameWithoutExtension($env:RELEASE_ASSET)
          $packageRoot = Join-Path "dist" $packageRootName
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Path out\app\* -Destination $packageRoot -Recurse -Force

          $amazExe = Get-ChildItem -Path out\amaz -File -Filter "AmazTool.exe" -Recurse |
            Select-Object -First 1
          if (-not $amazExe) { throw "AmazTool.exe was not produced" }
          Copy-Item -Path $amazExe.FullName -Destination (Join-Path $packageRoot "AmazTool.exe") -Force

          $binDir = "${{ steps.upstream_bin.outputs.bin_dir }}"
          if (-not $binDir -or -not (Test-Path $binDir)) {
            throw "Verified upstream bin directory output is missing"
          }
          Copy-Item -Path $binDir -Destination (Join-Path $packageRoot "bin") -Recurse -Force

          $zipPath = Join-Path (Resolve-Path dist) $env:RELEASE_ASSET
          # AmazTool removes the first path component from every ZIP entry during
          # an in-app update. Keep exactly one wrapper directory, matching the
          # official upstream packages, so v2rayN.exe and bin/ land correctly.
          Compress-Archive -Path $packageRoot -DestinationPath $zipPath -CompressionLevel Fastest -Force

          $verifyDir = "dist\verify"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $verifyDir -Force

          $topLevelEntries = @(Get-ChildItem -Path $verifyDir -Force)
          if ($topLevelEntries.Count -ne 1 -or
              -not $topLevelEntries[0].PSIsContainer -or
              $topLevelEntries[0].Name -cne $packageRootName) {
            throw "Final ZIP must contain exactly one updater wrapper directory: $packageRootName"
          }
          $verifyRoot = Join-Path $verifyDir $packageRootName

          $requiredFiles = @(
            (Join-Path $verifyRoot "v2rayN.exe"),
            (Join-Path $verifyRoot "AmazTool.exe")
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Required file missing from final ZIP: $file" }
          }
          $verifiedBin = Join-Path $verifyRoot "bin"
          if (-not (Test-Path $verifiedBin -PathType Container)) { throw "bin/ missing from final ZIP" }
          if (@(Get-ChildItem $verifiedBin -File -Recurse).Count -eq 0) { throw "bin/ is empty in final ZIP" }

          $size = (Get-Item $zipPath).Length
          if ($size -lt 10000000) { throw "Final ZIP is unexpectedly small: $size bytes" }
          $sha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          "zip=$zipPath" | Out-File $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File $env:GITHUB_OUTPUT -Append
          "bytes=$size" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Final ZIP: $zipPath"
          Write-Host "Bytes: $size"
          Write-Host "SHA-256: $sha256"

      - name: Validate real legacy in-place update
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        working-directory: source
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $repo = $env:GITHUB_REPOSITORY
          $targetTag = "${{ steps.resolve.outputs.release_tag }}"
          $candidateZip = "${{ steps.package.outputs.zip }}"
          $testRoot = "temp\legacy-update-integration"
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force }
          $baselineDownload = Join-Path $testRoot "baseline-download"
          $baselineExpanded = Join-Path $testRoot "baseline-expanded"
          $candidateExpanded = Join-Path $testRoot "candidate-expanded"
          $installRoot = Join-Path $testRoot "customer-moved-installation"
          New-Item -ItemType Directory -Force -Path $baselineDownload, $baselineExpanded, $candidateExpanded, $installRoot | Out-Null

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $targetTag --repo $repo *> $null
          $targetReleaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($targetReleaseExists) {
            $baselineTag = $targetTag
          }
          else {
            $baselineTag = gh release view --repo $repo --json tagName --jq .tagName
            if ($LASTEXITCODE -ne 0 -or -not $baselineTag) {
              throw "No previous NoAds release is available for legacy updater testing"
            }
          }

          gh release download $baselineTag `
            --repo $repo `
            --pattern $env:RELEASE_ASSET `
            --dir $baselineDownload `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download legacy package from $baselineTag" }

          $baselineZip = Get-ChildItem $baselineDownload -File -Filter $env:RELEASE_ASSET |
            Select-Object -First 1
          if (-not $baselineZip) { throw "Legacy NoAds ZIP was not downloaded" }
          Expand-Archive $baselineZip.FullName $baselineExpanded -Force
          Expand-Archive $candidateZip $candidateExpanded -Force

          $baselineMains = @(Get-ChildItem $baselineExpanded -Recurse -File -Filter "v2rayN.exe")
          if ($baselineMains.Count -ne 1) {
            throw "Legacy package must contain exactly one v2rayN.exe; found $($baselineMains.Count)"
          }
          $baselineRoot = $baselineMains[0].Directory.FullName
          $legacyUpdater = Join-Path $baselineRoot "AmazTool.exe"
          if (-not (Test-Path $legacyUpdater -PathType Leaf)) {
            throw "Legacy AmazTool.exe is missing beside v2rayN.exe"
          }
          Copy-Item -Path (Join-Path $baselineRoot "*") -Destination $installRoot -Recurse -Force

          $installedMain = Join-Path $installRoot "v2rayN.exe"
          $installedUpdater = Join-Path $installRoot "AmazTool.exe"
          Set-Content $installedMain "legacy-version-placeholder" -NoNewline

          $candidateMains = @(Get-ChildItem $candidateExpanded -Recurse -File -Filter "v2rayN.exe")
          if ($candidateMains.Count -ne 1) {
            throw "Candidate package must contain exactly one v2rayN.exe; found $($candidateMains.Count)"
          }
          $candidateRoot = $candidateMains[0].Directory.FullName
          $candidateUpdater = Join-Path $candidateRoot "AmazTool.exe"
          $expectedMainHash = (Get-FileHash $candidateMains[0].FullName -Algorithm SHA256).Hash
          $expectedUpdaterHash = (Get-FileHash $candidateUpdater -Algorithm SHA256).Hash
          $legacyUpdaterHash = (Get-FileHash $installedUpdater -Algorithm SHA256).Hash

          try {
            $legacyProcess = Start-Process `
              -FilePath $installedUpdater `
              -ArgumentList ('"{0}"' -f (Resolve-Path $candidateZip).Path) `
              -PassThru
            if (-not $legacyProcess.WaitForExit(120000)) {
              Stop-Process -Id $legacyProcess.Id -Force -ErrorAction SilentlyContinue
              throw "Legacy AmazTool did not exit within 120 seconds"
            }
            if ($legacyProcess.ExitCode -ne 0) {
              throw "Legacy AmazTool exited with code $($legacyProcess.ExitCode)"
            }

            $actualMainHash = (Get-FileHash $installedMain -Algorithm SHA256).Hash
            $actualUpdaterHash = (Get-FileHash $installedUpdater -Algorithm SHA256).Hash
            if ($actualMainHash -cne $expectedMainHash) {
              throw "Legacy updater did not replace v2rayN.exe with the candidate"
            }
            if ($actualUpdaterHash -cne $expectedUpdaterHash) {
              throw "Legacy updater did not replace AmazTool.exe with the candidate"
            }
            if ($actualUpdaterHash -ceq $legacyUpdaterHash) {
              throw "AmazTool.exe was not upgraded from the legacy binary"
            }

            $version = (Get-Item $installedMain).VersionInfo.FileVersion
            Write-Host "Legacy update source tag: $baselineTag"
            Write-Host "Updated v2rayN file version: $version"
            Write-Host "REAL_LEGACY_IN_PLACE_UPDATE=PASS"
          }
          finally {
            $installedMainPath = [System.IO.Path]::GetFullPath($installedMain)
            Get-Process -Name "v2rayN" -ErrorAction SilentlyContinue | ForEach-Object {
              try {
                if ([string]::Equals($_.MainModule.FileName, $installedMainPath, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $_.Id -Force
                }
              }
              catch {
                Write-Warning "Could not inspect or stop test process $($_.Id): $($_.Exception.Message)"
              }
            }
          }

      - name: Upload verified package artifact
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: v2rayN-windows-64-NoAds
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or update NoAds release
        if: >-
          steps.resolve.outputs.should_build == 'true' &&
          (github.event_name == 'schedule' || github.event.inputs.publish_release == 'true')
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $repo = $env:GITHUB_REPOSITORY
          $tag = "${{ steps.resolve.outputs.release_tag }}"
          $title = "v2rayN ${{ steps.resolve.outputs.version }} 去广告版 (NoAds)"
          $zip = "${{ steps.package.outputs.zip }}"
          $asset = $env:RELEASE_ASSET
          $sourceTag = "${{ steps.resolve.outputs.upstream_tag }}"
          $sourceSha = "${{ steps.source.outputs.sha }}"
          $sha256 = "${{ steps.package.outputs.sha256 }}"
          $bytes = "${{ steps.package.outputs.bytes }}"

          $notes = @(
            "基于上游正式 Release 自动构建，原推广入口已改为通知 / 教程。",
            "",
            "- 上游版本：$sourceTag",
            "- 上游提交：$sourceSha",
            "- 构建平台：Windows x64 / self-contained",
            "- 包含：v2rayN.exe、AmazTool.exe、bin/",
            "- 内置更新：兼容ZIP根目录或任意名称包装目录，替换失败返回明确错误码",
            "- 指南入口：https://guide.uutec.net/",
            "- 文件：$asset",
            "- 大小：$bytes bytes",
            "- SHA-256：$sha256"
          ) -join [Environment]::NewLine

          gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release edit $tag --repo $repo --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release $tag" }
          }
          else {
            gh release create $tag `
              --repo $repo `
              --target "${{ github.sha }}" `
              --title $title `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }

          gh release delete-asset $tag $asset --repo $repo --yes 2>$null
          gh release upload $tag $zip --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset to $tag" }

          Write-Host "Release published: https://github.com/$repo/releases/tag/$tag"
